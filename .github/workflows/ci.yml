name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (arm64)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NSUnbufferedIO: "YES"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check build environment
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          swift --version

      - name: Verify committed SVN runtime
        run: |
          cd Vendor/SVNRuntime
          shasum -a 256 --check SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          Scripts/validate-svn-runtime.sh Vendor/SVNRuntime

      - name: Install XcodeGen 2.46.0
        env:
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --silent \
            --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Install .NET SDK for Word diff runtime
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '6.0.x'

      - name: Build Word diff runtime and verify generated project
        run: |
          Scripts/package-worddiff-runtime.sh
          xcodegen generate
          git diff --exit-code -- SVNClient.xcodeproj

      - name: Run Debug tests
        run: |
          xcodebuild \
            -project SVNClient.xcodeproj \
            -scheme SVNClient \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Build Release
        run: |
          xcodebuild \
            -project SVNClient.xcodeproj \
            -scheme SVNClient \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify SVN runtime in Release app
        run: |
          build_settings="$(xcodebuild \
            -project SVNClient.xcodeproj \
            -scheme SVNClient \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -showBuildSettings)"
          target_build_dir="$(printf '%s\n' "$build_settings" | \
            awk -F ' = ' '/^[[:space:]]*TARGET_BUILD_DIR = / && !found { print $2; found = 1 }')"
          full_product_name="$(printf '%s\n' "$build_settings" | \
            awk -F ' = ' '/^[[:space:]]*FULL_PRODUCT_NAME = / && !found { print $2; found = 1 }')"
          test -n "$target_build_dir"
          test -n "$full_product_name"
          runtime="$target_build_dir/$full_product_name/Contents/Resources/SVNRuntime"
          Scripts/validate-svn-runtime.sh "$runtime"
