name: SVNClient
options:
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
packages:
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: 6.0.0
  XMLCoder:
    url: https://github.com/CoreOffice/XMLCoder.git
    from: 0.17.0
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: 4.2.2
targets:
  SVNClient:
    type: application
    platform: macOS
    productName: Folio SVN
    preBuildScripts:
      - name: Validate bundled SVN runtime
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/Scripts/validate-svn-runtime.sh" "$SRCROOT/Vendor/SVNRuntime"
    postBuildScripts:
      - name: Sign bundled SVN runtime
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
            RUNTIME_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/SVNRuntime"
            SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
            SIGN_OPTIONS=""
            if [ "$SIGN_IDENTITY" != "-" ]; then
              SIGN_OPTIONS="--options runtime"
              if [ "$CONFIGURATION" = "Release" ]; then
                SIGN_OPTIONS="$SIGN_OPTIONS --timestamp"
              fi
            fi
            if [ -d "$RUNTIME_DIR/lib" ]; then
              find "$RUNTIME_DIR/lib" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' LIBRARY; do
                codesign --force $SIGN_OPTIONS --sign "$SIGN_IDENTITY" "$LIBRARY"
              done
            fi
            codesign --force $SIGN_OPTIONS --sign "$SIGN_IDENTITY" "$RUNTIME_DIR/bin/svn"
          fi
      - name: Sign bundled Word diff runtime
        basedOnDependencyAnalysis: false
        script: |
          RUNTIME_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/WordDiffRuntime"
          if [ ! -x "$RUNTIME_DIR/worddiff-demo" ]; then
            echo "error: Run Scripts/package-worddiff-runtime.sh before building."
            exit 1
          fi
          if [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
            SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
            SIGN_OPTIONS="--options runtime"
            if [ "$SIGN_IDENTITY" != "-" ] && [ "$CONFIGURATION" = "Release" ]; then
              SIGN_OPTIONS="$SIGN_OPTIONS --timestamp"
            fi
            find "$RUNTIME_DIR" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' LIBRARY; do
              codesign --force $SIGN_OPTIONS --sign "$SIGN_IDENTITY" "$LIBRARY"
            done
            codesign --force $SIGN_OPTIONS --entitlements "$SRCROOT/Tools/WordDiffDemo/runtime.entitlements" --sign "$SIGN_IDENTITY" "$RUNTIME_DIR/worddiff-demo"
          fi
    sources:
      - path: Sources/SVNClient
      - path: Vendor/SVNRuntime
        type: folder
        buildPhase: resources
      - path: Vendor/WordDiffRuntime
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.west2online.svnclient
        PRODUCT_NAME: Folio SVN
        PRODUCT_MODULE_NAME: SVNClient
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Folio SVN
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        DEVELOPMENT_TEAM: MEWHFZ92DY
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
    dependencies:
      - package: SnapKit
      - package: XMLCoder
      - package: GRDB
      - package: KeychainAccess
  SVNClientTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SVNClientTests
    resources:
      - path: Tests/SVNClientTests/Fixtures
    dependencies:
      - target: SVNClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.svnclient.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Folio SVN.app/Contents/MacOS/Folio SVN"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SVNClient:
    build:
      targets:
        SVNClient: all
        SVNClientTests: [test]
    test:
      targets:
        - SVNClientTests
